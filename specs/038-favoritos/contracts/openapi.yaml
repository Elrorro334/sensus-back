openapi: 3.1.0
info:
  title: "Sensus API — Spec 038 Favoritos de ofertas"
  version: 1.0.0
  description: "Borrador del contrato del spec 038. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/users/favorites/{id}:
    post:
      summary: "Borrador de POST /api/v1/users/favorites/{id}"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
        '404': { description: No encontrado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
