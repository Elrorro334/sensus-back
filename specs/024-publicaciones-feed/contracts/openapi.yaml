openapi: 3.1.0
info:
  title: "Sensus API — Spec 024 Publicaciones del feed"
  version: 1.0.0
  description: "Borrador del contrato del spec 024. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/feed/posts:
    post:
      summary: "Borrador de POST /api/v1/feed/posts"
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
  /api/v1/feed/posts/{id}:
    delete:
      summary: "Borrador de DELETE /api/v1/feed/posts/{id}"
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Sin contenido }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
        '404': { description: No encontrado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
