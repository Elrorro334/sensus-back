openapi: 3.1.0
info:
  title: "Sensus API — Spec 006 Consulta de mi comercio"
  version: 1.0.0
  description: "Borrador del contrato del spec 006. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/merchants/me:
    get:
      summary: "Borrador de GET /api/v1/merchants/me"
