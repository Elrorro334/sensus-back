openapi: 3.1.0
info:
  title: "Sensus API — Spec 004 Cierre de sesión y revocación de token"
  version: 1.0.0
  description: "Contrato del spec 004."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/auth/logout:
    post:
      summary: "Cierra la sesión activa revocando el token JWT actual de forma verificable e idempotente"
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Sin contenido }
        '401': { description: No autenticado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
