openapi: 3.1.0
info:
  title: "Sensus API — Spec 025 Comentarios del feed"
  version: 1.0.0
  description: "Borrador del contrato del spec 025. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/feed/posts/{id}/comments:
    post:
      summary: "Borrador de POST /api/v1/feed/posts/{id}/comments"
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
        '404': { description: No encontrado }
    get:
      summary: "Borrador de GET /api/v1/feed/posts/{id}/comments"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
        '404': { description: No encontrado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
