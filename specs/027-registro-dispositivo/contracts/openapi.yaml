openapi: 3.1.0
info:
  title: "Sensus API — Spec 027 Registro de dispositivo para push"
  version: 1.0.0
  description: "Borrador del contrato del spec 027. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/users/device-token:
    put:
      summary: "Borrador de PUT /api/v1/users/device-token"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
