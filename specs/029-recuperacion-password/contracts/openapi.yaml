openapi: 3.1.0
info:
  title: "Sensus API — Spec 029 Recuperación de contraseña"
  version: 1.0.0
  description: "Borrador del contrato del spec 029. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/auth/recover:
    post:
      summary: "Borrador de POST /api/v1/auth/recover"
      security: []
      responses:
        '202': { description: Aceptado }
        '400': { description: Solicitud inválida }
  /api/v1/auth/recover/confirm:
    post:
      summary: "Borrador de POST /api/v1/auth/recover/confirm"
      security: []
      responses:
        '204': { description: Sin contenido }
        '400': { description: Solicitud inválida }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
