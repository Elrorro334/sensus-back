openapi: 3.1.0
info:
  title: "Sensus API — Spec 039 Me gusta en publicaciones"
  version: 1.0.0
  description: "Borrador del contrato del spec 039. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/feed/posts/{id}/like:
    post:
      summary: "Borrador de POST /api/v1/feed/posts/{id}/like"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
        '404': { description: No encontrado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
