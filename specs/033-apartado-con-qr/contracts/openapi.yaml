openapi: 3.1.0
info:
  title: "Sensus API — Spec 033 Apartado de oferta con código QR"
  version: 1.0.0
  description: "Borrador del contrato del spec 033. Completar esquemas antes de implementar."
servers:
  - url: https://localhost:5001
paths:
  /api/v1/offers/{id}/claim:
    post:
      summary: "Borrador de POST /api/v1/offers/{id}/claim"
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
        '404': { description: No encontrado }
  /api/v1/offers/claims/{code}/redeem:
    post:
      summary: "Borrador de POST /api/v1/offers/claims/{code}/redeem"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Solicitud inválida }
        '401': { description: No autenticado }
        '404': { description: No encontrado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
